<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体育祭 速報ビューア</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif;background:#f4f1ea;color:#0a0a0a;padding:1rem;line-height:1.5;font-size:14px}
.container{max-width:900px;margin:0 auto}
.report-header{background:#0a0a0a;color:white;padding:1rem 1.2rem;border-radius:8px;margin-bottom:1rem;border:2px solid #0a0a0a;box-shadow:4px 4px 0 #e63946}
.report-header h1{font-size:1.3rem;letter-spacing:.03em}
.report-header .ts{font-size:.85rem;opacity:.8;margin-top:.3rem}
.report-header .progress{margin-top:.5rem;font-size:.85rem;background:rgba(255,255,255,.15);padding:.3rem .6rem;border-radius:4px;display:inline-block}
.viewer-note{background:#fff3cd;border:1.5px solid #d97706;border-radius:6px;padding:.7rem 1rem;margin-bottom:1rem;font-size:.85rem}
.viewer-note strong{color:#7c4a00}
.delay-info{background:#fee2e2;border:1.5px solid #e63946;border-radius:6px;padding:.7rem 1rem;margin-bottom:1rem;font-size:.85rem}
.delay-info span{background:white;border:1px solid #e63946;border-radius:3px;padding:.15rem .5rem;margin-left:.3rem;font-weight:700;display:inline-block;margin-top:.2rem}
h2{font-size:1.05rem;margin:1.2rem 0 .6rem;padding-bottom:.3rem;border-bottom:2px solid #0a0a0a}
section.live-block,section.next-block{background:white;border:2px solid #0a0a0a;border-radius:8px;padding:.8rem;margin-bottom:1rem}
section.live-block{border-color:#e63946}
section.live-block h2{border-bottom-color:#e63946;color:#e63946}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem}
.g-cell{background:#f4f1ea;border:1.5px solid #0a0a0a;border-radius:5px;padding:.5rem;text-align:center}
.g-cell.done.home-win{background:linear-gradient(90deg,rgba(42,157,143,.18),#f4f1ea)}
.g-cell.done.away-win{background:linear-gradient(270deg,rgba(42,157,143,.18),#f4f1ea)}
.g-cell.pending{background:#fafaf7;color:#888}
.g-teams{font-weight:700;font-size:.95rem;font-family:'JetBrains Mono',monospace}
.g-teams .vs{color:#888;font-weight:400;margin:0 .3rem}
.g-score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.3rem;margin-top:.2rem;color:#2a9d8f}
.g-status{font-size:.7rem;color:#888;margin-top:.2rem;font-weight:700;letter-spacing:.05em}
.sp-block{margin-bottom:1.2rem}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.6rem}
.st-card{background:white;border:1.5px solid #0a0a0a;border-radius:5px;overflow:hidden}
.st-head{background:#0a0a0a;color:white;padding:.3rem .7rem;font-weight:700;font-size:.85rem;display:flex;justify-content:space-between;align-items:center}
.st-head span{font-size:.7rem;opacity:.7;font-weight:400}
.st-table{width:100%;border-collapse:collapse;font-size:.78rem}
.st-table th,.st-table td{padding:.25rem .35rem;text-align:center;border-bottom:1px solid #eee}
.st-table th{background:#f4f1ea;font-size:.65rem}
.st-table td:nth-child(2){text-align:left;font-weight:700}
.st-table tr.r1 td{background:rgba(244,162,97,.18)}
.slot{background:white;border:1.5px solid #ddd;border-radius:5px;margin-bottom:.4rem;overflow:hidden}
.slot.live{border-color:#e63946;border-width:2px}
.slot.done{opacity:.7}
.slot-head{background:#f4f1ea;padding:.35rem .7rem;display:flex;justify-content:space-between;align-items:center;font-size:.8rem}
.slot.live .slot-head{background:#fee2e2}
.slot-no{font-weight:700}
.slot-time{font-family:'JetBrains Mono',monospace;font-weight:700}
.slot-games{padding:.3rem}
.sg-row{display:grid;grid-template-columns:78px 1fr auto;gap:.4rem;align-items:center;padding:.25rem .3rem;border-bottom:1px dashed #eee;font-size:.78rem}
.sg-row:last-child{border-bottom:none}
.sg-sport{background:#0a0a0a;color:white;padding:.1rem .35rem;border-radius:2px;font-size:.65rem;font-weight:700;text-align:center}
.sg-match{font-weight:700;font-family:'JetBrains Mono',monospace}
.sg-score{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:38px;text-align:right}
.footer{text-align:center;margin-top:1.5rem;padding:1rem;font-size:.75rem;color:#888}
.error{background:#fee2e2;border:2px solid #e63946;border-radius:8px;padding:1.5rem;text-align:center}
.error h2{color:#e63946;border:none;margin:0 0 .5rem}
.empty{text-align:center;padding:2rem;color:#888}

/* 下部タブ */
.bottom-tabs{
  position:fixed;
  bottom:0;left:0;right:0;
  background:white;
  border-top:2px solid #0a0a0a;
  display:flex;
  z-index:100;
  box-shadow:0 -4px 12px rgba(0,0,0,.08);
}
.bt-btn{
  flex:1;
  background:transparent;
  border:none;
  cursor:pointer;
  padding:.55rem .1rem .5rem;
  font-family:inherit;
  font-weight:700;
  font-size:.6rem;
  color:#666;
  border-top:3px solid transparent;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.12rem;
  line-height:1.1;
}
.bt-btn:active{background:#f4f1ea}
.bt-btn .bt-ico{font-size:1.05rem;line-height:1}
section{scroll-margin-top:1rem}
#sec-top,#sec-live,#sec-standings,#sec-schedule,#sec-class{scroll-margin-top:1rem}

/* クラス別ビュー */
.cv-selector{
  display:flex;flex-wrap:wrap;gap:.3rem;
  margin-bottom:.8rem;
  padding:.4rem;
  background:white;
  border:1.5px solid #0a0a0a;
  border-radius:6px;
}
.cv-class-btn{
  background:transparent;
  border:1.5px solid #ccc;
  border-radius:4px;
  padding:.4rem .6rem;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:.82rem;
  cursor:pointer;
  min-width:48px;
  color:#0a64f4;
}
.cv-class-btn.active{
  background:#0a0a0a;
  color:white;
  border-color:#0a0a0a;
}
.cv-summary-card{
  background:white;
  border:2px solid #0a0a0a;
  border-radius:8px;
  margin-bottom:1rem;
  overflow:hidden;
  box-shadow:4px 4px 0 #0a0a0a;
}
.cv-summary-head{
  background:#0a0a0a;
  color:white;
  padding:.7rem 1rem;
  font-family:'Bebas Neue';
  font-size:1.5rem;
  letter-spacing:.05em;
  display:flex;justify-content:space-between;align-items:center;
}
.cv-total-badge{
  font-size:.7rem;
  background:rgba(255,255,255,.15);
  padding:.2rem .5rem;
  border-radius:3px;
  font-family:'Noto Sans JP',sans-serif;
  letter-spacing:0;
}
.cv-sport-block{
  border-bottom:1px solid #e0dcd0;
}
.cv-sport-block:last-of-type{border-bottom:none}
.cv-sport-row{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  padding:.55rem .8rem;
  font-size:.85rem;
}
.cv-sport-name{
  font-weight:700;
}
.cv-league-tag{
  display:inline-block;
  background:#f4f1ea;
  padding:.05rem .35rem;
  border-radius:2px;
  font-size:.7rem;
  margin-left:.4rem;
  font-family:'JetBrains Mono',monospace;
}
.cv-sport-stats{
  display:flex;
  gap:.6rem;
  font-family:'JetBrains Mono',monospace;
  font-size:.78rem;
  align-items:center;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.cv-wld{font-weight:700}
.cv-wld .w{color:#2a9d8f}
.cv-wld .l{color:#888}
.cv-gf{color:#444}
.cv-rank{
  background:#e63946;
  color:white;
  padding:.15rem .45rem;
  border-radius:3px;
  font-weight:700;
  font-size:.78rem;
}
.cv-rank.rank-1{background:#f4a261}
.cv-rank.no-data{background:#ccc;color:#666}
.cv-match-list{
  padding:0 1rem .5rem 1.8rem;
  background:#fafaf7;
  border-top:1px dashed #e0dcd0;
}
.cv-match-row{
  display:grid;
  grid-template-columns:60px 1fr auto auto;
  gap:.5rem;
  align-items:center;
  padding:.3rem 0;
  font-size:.78rem;
  border-bottom:1px dashed #eee;
}
.cv-match-row:last-child{border-bottom:none}
.cv-match-no{
  font-family:'JetBrains Mono',monospace;
  color:#888;
  font-size:.72rem;
}
.cv-match-opp{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
}
.cv-match-score{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:.85rem;
}
.cv-match-result{
  width:24px;
  height:22px;
  border-radius:3px;
  text-align:center;
  line-height:22px;
  font-weight:700;
  font-size:.75rem;
  color:white;
}
.cv-match-result.win{background:#2a9d8f}
.cv-match-result.loss{background:#999}
.cv-match-result.draw{background:#e63946}
.cv-match-row.pending .cv-match-score{color:#ccc;font-weight:400}
.cv-total-row{
  background:#f4f1ea;
  padding:.7rem 1rem;
  border-top:2px solid #0a0a0a;
  font-weight:700;
}
.cv-total-label{font-size:.85rem;color:#888;margin-bottom:.2rem}
.cv-total-stats{
  display:flex;gap:.8rem;flex-wrap:wrap;
  font-family:'JetBrains Mono',monospace;font-size:.9rem;
}
.cv-total-stats .w{color:#2a9d8f}
.cv-total-stats .l{color:#888}

/* クラス別戦績：トーナメント区切りと行 */
.cv-t-divider{
  padding:.3rem .5rem;
  font-size:.7rem;
  font-weight:700;
  color:#e63946;
  background:linear-gradient(to right, #fff4e6, transparent);
  border-top:1.5px dashed #e63946;
  border-bottom:1px solid #f4d4d8;
  margin-top:.15rem;
  letter-spacing:.05em;
}
.cv-t-row{
  background:linear-gradient(to right, rgba(230,57,70,.04), transparent);
}
.cv-t-row.win{background:linear-gradient(to right, rgba(42,157,143,.08), transparent)}
.cv-t-row.loss{background:linear-gradient(to right, rgba(136,136,136,.06), transparent)}
.cv-t-row .cv-match-no{
  color:#e63946;
  font-weight:700;
  font-family:inherit;
  font-size:.72rem;
}
.cv-t-note{
  grid-column:1 / -1;
  margin-top:.2rem;
  font-size:.7rem;
  color:#666;
  font-style:italic;
  background:#f4f1ea;
  padding:.15rem .4rem;
  border-radius:2px;
}

/* === ビューア トーナメント表 === */
.vt-selectors{
  margin-bottom:.8rem;
  background:white;
  border:1.5px solid #0a0a0a;
  border-radius:6px;
  padding:.5rem;
}
.vt-sport-row{
  display:flex;flex-wrap:wrap;gap:.3rem;
  margin-bottom:.5rem;
}
.vt-sport-btn{
  background:transparent;
  border:1.5px solid #ccc;
  border-radius:4px;
  padding:.35rem .5rem;
  font-family:inherit;
  font-weight:700;
  font-size:.75rem;
  cursor:pointer;
  color:#0a64f4;
}
.vt-sport-btn.active{background:#0a0a0a;color:white;border-color:#0a0a0a}
.vt-grade-row{
  display:flex;gap:.4rem;
}
.vt-grade-btn{
  flex:1;
  background:transparent;
  border:1.5px solid #ccc;
  border-radius:4px;
  padding:.4rem .5rem;
  font-family:inherit;
  font-weight:700;
  font-size:.78rem;
  cursor:pointer;
  color:#444;
}
.vt-grade-btn.active{background:#0a0a0a;color:white;border-color:#0a0a0a}
.vt-bracket{
  background:white;
  border:2px solid #0a0a0a;
  border-radius:6px;
  padding:.8rem;
  box-shadow:3px 3px 0 #0a0a0a;
  margin-bottom:.8rem;
}
.vt-title{
  font-weight:900;
  font-size:1rem;
  margin-bottom:.6rem;
  padding-bottom:.4rem;
  border-bottom:2px solid #0a0a0a;
}
.vt-svg-wrap{
  width:100%;
  overflow-x:auto;
}
.vt-svg{width:100%;height:auto;display:block;min-width:380px}
.vt-svg .vt-seed{
  font-family:'JetBrains Mono', monospace;
  font-weight:700;
  font-size:13px;
  fill:#0a0a0a;
}
.vt-svg .vt-seed.tbd{fill:#bbb;font-weight:400}
.vt-svg .vt-seed-label{
  font-family:'JetBrains Mono', monospace;
  font-weight:700;
  font-size:10px;
  fill:#999;
}
.vt-svg foreignObject .vt-mbox{
  box-sizing:border-box;
  height:100%;
  width:100%;
  background:white;
  border:1.5px solid #0a0a0a;
  border-radius:3px;
  padding:2px;
  display:flex;
  flex-direction:column;
  justify-content:space-evenly;
}
.vt-svg foreignObject .vt-mbox.done{background:#fff}
.vt-svg foreignObject .vt-team{
  display:flex;justify-content:space-between;align-items:center;
  padding:1px 3px;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:10px;
}
.vt-svg foreignObject .vt-team.winner{
  background:#fff4e6;
  border:1.5px solid #e63946;
  border-radius:3px;
  font-weight:900;
}
.vt-svg foreignObject .vt-team.winner .vt-score{
  color:#e63946;
  font-weight:900;
}
.vt-svg foreignObject .vt-team.tbd{color:#bbb;font-weight:400}
.vt-svg foreignObject .vt-div{height:1px;background:#ddd;margin:1px 0}
.vt-svg foreignObject .vt-note{
  font-size:8px;
  color:#666;
  font-style:italic;
  text-align:center;
  padding:1px 2px;
  background:#f4f1ea;
  border-radius:2px;
  margin-top:1px;
  font-weight:400;
  line-height:1.1;
}
.vt-svg foreignObject .vt-score{
  font-size:11px;
  color:#e63946;
}
.vt-champion{
  margin-top:.6rem;
  background:linear-gradient(135deg,#f4a261,#e63946);
  color:white;
  font-weight:700;
  border-radius:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:.95rem;
  padding:.5rem;
  text-align:center;
  letter-spacing:.05em;
}
.vt-extras{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.5rem;
}
.vt-extra-card{
  background:white;
  border:1.5px solid #0a0a0a;
  border-radius:6px;
  padding:.5rem;
}
.vt-extra-card h4{
  margin:0 0 .4rem;
  font-size:.85rem;
  color:#e63946;
  text-align:center;
  border:none;
}
.vt-extra-card .vt-mbox{
  background:#fafaf7;
  border:1.5px solid #0a0a0a;
  border-radius:3px;
  padding:.3rem;
}
.vt-extra-card .vt-team{
  display:flex;justify-content:space-between;align-items:center;
  padding:.15rem .25rem;
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:.82rem;
}
.vt-extra-card .vt-team.winner{
  background:#fff4e6;
  border:1.5px solid #e63946;
  border-radius:3px;
  font-weight:900;
}
.vt-extra-card .vt-team.winner .vt-score{color:#e63946;font-weight:900}
.vt-extra-card .vt-team.tbd{color:#bbb;font-weight:400}
.vt-extra-card .vt-div{height:1px;background:#ddd;margin:.1rem 0}
.vt-extra-card .vt-note{
  font-size:.7rem;
  color:#666;
  font-style:italic;
  text-align:center;
  padding:.2rem .35rem;
  background:#f4f1ea;
  border-radius:2px;
  margin-top:.25rem;
  font-weight:400;
}
.vt-extra-card .vt-score{font-size:.85rem;color:#e63946}
.vt-rank-result{
  text-align:center;
  margin-top:.4rem;
  font-weight:700;
  font-size:.85rem;
}
.vt-rank-result.third{color:#e63946}
.vt-rank-result.fifth{color:#2a9d8f}
#sec-tournament{scroll-margin-top:1rem}
#sec-final{scroll-margin-top:1rem}

/* === 最終結果 === */
.fr-container{
  display:flex;
  flex-direction:column;
  gap:1rem;
}
.fr-tabs{
  display:flex;
  flex-direction:column;
  gap:.3rem;
  background:white;
  border:1.5px solid #0a0a0a;
  border-radius:6px;
  padding:.3rem;
}
.fr-tabs-overall{
  display:flex;
}
.fr-tabs-sports{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:.25rem;
}
.fr-tab{
  background:transparent;
  border:1.5px solid transparent;
  border-radius:4px;
  padding:.45rem .3rem;
  font-family:inherit;
  font-weight:700;
  font-size:.72rem;
  cursor:pointer;
  color:#666;
  white-space:nowrap;
  text-align:center;
}
.fr-tabs-overall .fr-tab{
  flex:1;
}
.fr-tab.active{
  background:#0a0a0a;
  color:white;
}
.fr-tab:active{background:#f4f1ea}
.fr-tab.active:active{background:#333}
.fr-warn{
  background:#fff4e6;
  border:1.5px solid #f4a261;
  border-radius:6px;
  padding:.6rem .8rem;
  font-size:.82rem;
  color:#7a4a1a;
  font-weight:700;
}
.fr-info{
  background:#fafaf7;
  border:1px solid #ddd;
  border-radius:4px;
  padding:.6rem .8rem;
  font-size:.78rem;
  line-height:1.5;
  color:#444;
}
.fr-group{
  background:white;
  border:2px solid #0a0a0a;
  border-radius:6px;
  overflow:hidden;
  box-shadow:3px 3px 0 #0a0a0a;
}
.fr-group-title{
  margin:0;
  padding:.55rem .8rem;
  font-size:.9rem;
  font-weight:900;
  letter-spacing:.05em;
  color:white;
  background:linear-gradient(135deg, #0a0a0a, #2a2a2a);
  border:none;
}
.fr-group-松 .fr-group-title{background:linear-gradient(135deg, #e63946, #c1121f)}
.fr-group-竹 .fr-group-title{background:linear-gradient(135deg, #2a9d8f, #1e7167)}
.fr-group-梅 .fr-group-title{background:linear-gradient(135deg, #777, #555)}
.fr-rows{
  display:flex;
  flex-direction:column;
}
.fr-row{
  display:grid;
  grid-template-columns:54px 1fr auto;
  align-items:center;
  gap:.6rem;
  padding:.55rem .8rem;
  background:white;
  border:none;
  border-bottom:1px dashed #e0dcd0;
  font-family:inherit;
  text-align:left;
  cursor:pointer;
  width:100%;
}
.fr-row:last-child{border-bottom:none}
.fr-row:active{background:#f4f1ea}
.fr-rank{
  font-family:'JetBrains Mono', monospace;
  font-weight:900;
  font-size:.95rem;
  text-align:center;
  padding:.2rem .3rem;
  border-radius:3px;
}
.fr-rank-松{background:#fff4e6;color:#e63946;border:1.5px solid #e63946}
.fr-rank-竹{background:#e6f4f1;color:#2a9d8f;border:1.5px solid #2a9d8f}
.fr-rank-梅{background:#f4f1ea;color:#666;border:1.5px solid #888}
.fr-rank-gold{
  background:linear-gradient(135deg,#fff8dc,#ffd700);
  color:#8b6914;
  border:1.5px solid #d4af37;
  font-weight:900;
}
.fr-rank-silver{
  background:linear-gradient(135deg,#f5f5f5,#c0c0c0);
  color:#444;
  border:1.5px solid #999;
  font-weight:900;
}
.fr-rank-bronze{
  background:linear-gradient(135deg,#ffe4cc,#cd7f32);
  color:#5a3a14;
  border:1.5px solid #a0612a;
  font-weight:900;
}
.fr-rank-default{
  background:#fafaf7;
  color:#444;
  border:1.5px solid #ccc;
}
.fr-team{
  font-family:'JetBrains Mono', monospace;
  font-weight:700;
  font-size:1rem;
  color:#0a0a0a;
}
.fr-points{
  font-family:'JetBrains Mono', monospace;
  font-weight:900;
  font-size:1.05rem;
  color:#0a0a0a;
}
.fr-pts-unit{
  font-size:.7rem;
  font-weight:400;
  color:#888;
  margin-left:2px;
}

/* === 最終結果 モーダル === */
.fr-modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:200;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:1rem;
  overflow-y:auto;
}
.fr-modal{
  background:white;
  border:2px solid #0a0a0a;
  border-radius:8px;
  max-width:560px;
  width:100%;
  margin:auto;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:6px 6px 0 #0a0a0a;
  max-height:90vh;
}
.fr-modal-head{
  background:#0a0a0a;
  color:white;

// ===== URLハッシュ解析 =====
function decodeHashData(){
  const hash = location.hash.slice(1); // # を除く
  if(!hash) return null;
  try{
    // Base64 URL-safe → Uint8Array → pako解凍 → JSON
    const b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    const json = pako.inflate(bytes, {to:'string'});
    return JSON.parse(json);
  }catch(e){
    console.error('Decode failed:', e);
    return null;
  }
}

function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fromMin(min){
  const h = Math.floor(min/60), m = min%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function render(snapshot){
  if(!snapshot){
    document.getElementById('container').innerHTML = `
      <div class="error">
        <h2>⚠ データが読み込めません</h2>
        <p>このURLには有効なデータが含まれていないか、URLが切れています。<br>本部から再度速報URLを取得してください。</p>
      </div>`;
    return;
  }
  const results = snapshot.results || {};
  const delays = snapshot.delays || {};
  const generatedAt = snapshot.ts ? new Date(snapshot.ts) : new Date();
  const dateStr = `${generatedAt.getFullYear()}/${generatedAt.getMonth()+1}/${generatedAt.getDate()} ${String(generatedAt.getHours()).padStart(2,'0')}:${String(generatedAt.getMinutes()).padStart(2,'0')}`;
  document.title = `体育祭 速報 - ${dateStr}`;

  function getDelay(sport){ return delays[sport] || 0; }
  function effStartMin(g){ return toMin(g.time) + getDelay(g.sport); }
  function effEndMin(g){ return toMin(g.end) + getDelay(g.sport); }
  function effStart(g){ return fromMin(effStartMin(g)); }
  function effEnd(g){ return fromMin(effEndMin(g)); }

  // スナップショット時刻基準で判定
  const nowMin = generatedAt.getHours()*60 + generatedAt.getMinutes();
  function gameStatus(g){
    const r = results[g.id];
    if(r && r.status === 'done') return 'done';
    if(nowMin >= effStartMin(g) && nowMin <= effEndMin(g)+2) return 'live';
    if(nowMin > effEndMin(g)) return 'done-auto';
    return 'pending';
  }

  // LIVE中試合
  const liveGames = SCHEDULE.filter(g=>nowMin>=effStartMin(g)&&nowMin<=effEndMin(g)+2);
  // 次の試合
  const liveGameIds = new Set(liveGames.map(g=>g.id));
  let nextGames = SCHEDULE.filter(g=>!liveGameIds.has(g.id)&&nowMin<effStartMin(g));
  const nextBySport = {};
  nextGames.forEach(g=>{
    if(!nextBySport[g.sport]||effStartMin(g)<effStartMin(nextBySport[g.sport])){
      nextBySport[g.sport]=g;
    }
  });
  nextGames = Object.values(nextBySport).sort((a,b)=>effStartMin(a)-effStartMin(b));

  function gameCell(g){
    const r = results[g.id];
    if(!r||r.homeScore==null){
      const st = gameStatus(g);
      const label = st==='live'?'LIVE': (nowMin > effEndMin(g) ? '未入力' : '');
      return `<div class="g-cell pending">
        <div class="g-teams">${g.home} <span class="vs">vs</span> ${g.away}</div>
        <div class="g-status">${label||'-'}</div>
      </div>`;
    }
    let cls = '';
    if(r.homeScore > r.awayScore) cls = 'home-win';
    else if(r.homeScore < r.awayScore) cls = 'away-win';
    return `<div class="g-cell done ${cls}">
      <div class="g-teams">${g.home} <span class="vs">vs</span> ${g.away}</div>
      <div class="g-score">${r.homeScore} - ${r.awayScore}</div>
    </div>`;
  }

  function buildStandingsFor(sport){
    const sportGames = SCHEDULE.filter(g=>g.sport===sport);
    const leagues = [...new Set(sportGames.map(g=>g.league))].sort();
    return leagues.map(L=>{
      const lg = sportGames.filter(g=>g.league===L);
      const teams = [...new Set(lg.flatMap(g=>[g.home,g.away]))];
      const stat = {};
      teams.forEach(t=>{ stat[t]={team:t,gp:0,w:0,l:0,d:0,gf:0,ga:0,pts:0}; });
      lg.forEach(g=>{
        const r = results[g.id];
        if(!r||r.status!=='done'||r.homeScore==null) return;
        stat[g.home].gp++; stat[g.away].gp++;
        stat[g.home].gf+=r.homeScore; stat[g.home].ga+=r.awayScore;
        stat[g.away].gf+=r.awayScore; stat[g.away].ga+=r.homeScore;
        if(r.homeScore>r.awayScore){stat[g.home].w++;stat[g.away].l++;stat[g.home].pts+=3;}
        else if(r.homeScore<r.awayScore){stat[g.away].w++;stat[g.home].l++;stat[g.away].pts+=3;}
        else{stat[g.home].d++;stat[g.away].d++;stat[g.home].pts+=1;stat[g.away].pts+=1;}
      });
      const rows = Object.values(stat).sort((a,b)=>{
        if(b.pts!==a.pts) return b.pts-a.pts;
        const aDiff=a.gf-a.ga, bDiff=b.gf-b.ga;
        if(bDiff!==aDiff) return bDiff-aDiff;
        return b.gf-a.gf;
      });
      const ranks = [];
      rows.forEach((r,i)=>{
        if(i===0) ranks.push(1);
        else{
          const prev = rows[i-1];
          const isTied = (r.pts===prev.pts && (r.gf-r.ga)===(prev.gf-prev.ga) && r.gf===prev.gf);
          ranks.push(isTied ? ranks[i-1] : i+1);
        }
      });
      return `<div class="st-card">
        <div class="st-head">${L}リーグ <span>${lg.filter(g=>results[g.id]&&results[g.id].status==='done').length}/${lg.length}試合</span></div>
        <table class="st-table">
          <thead><tr><th>順</th><th>クラス</th><th>勝</th><th>分</th><th>負</th><th>得</th><th>失</th><th>差</th><th>点</th></tr></thead>
          <tbody>${rows.map((r,i)=>`<tr class="${ranks[i]===1?'r1':''}"><td>${ranks[i]}</td><td>${r.team}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga>0?'+':''}${r.gf-r.ga}</td><td><strong>${r.pts}</strong></td></tr>`).join('')}</tbody>
        </table>
      </div>`;
    }).join('');
  }

  const sports = ['男子バスケ','女子バスケ','男子サッカー','女子サッカー','男子バレー','女子バレー'];
  const standingsHtml = sports.map(s=>`<section class="sp-block"><h2>${s}</h2><div class="st-grid">${buildStandingsFor(s)}</div></section>`).join('');

  const total = SCHEDULE.length;
  const done = Object.values(results).filter(r=>r.status==='done').length;

  const delayedSports = Object.entries(delays).filter(([s,d])=>d>0);
  const delayHtml = delayedSports.length > 0 ? `
    <div class="delay-info">
      <strong>⚠ 遅延発生中：</strong>
      ${delayedSports.map(([s,d])=>`<span>${s} +${d}分</span>`).join('')}
    </div>` : '';

  const slots = [...new Set(SCHEDULE.map(g=>g.no))].sort((a,b)=>a-b);
  const scheduleHtml = slots.map(n=>{
    const games = SCHEDULE.filter(g=>g.no===n);
    const time = games[0].time + '〜' + games[0].end;
    const statuses = games.map(g=>gameStatus(g));
    let slotStatus = 'pending';
    if(statuses.some(s=>s==='live')) slotStatus='live';
    else if(statuses.every(s=>s==='done'||s==='done-auto')) slotStatus='done';
    return `<div class="slot ${slotStatus}">
      <div class="slot-head"><span class="slot-no">試合${n}</span><span class="slot-time">${time}</span></div>
      <div class="slot-games">
        ${games.map(g=>{
          const r = results[g.id];
          const sc = (r&&r.homeScore!=null) ? `${r.homeScore}-${r.awayScore}` : '';
          return `<div class="sg-row">
            <span class="sg-sport">${g.sport.replace('男子','男').replace('女子','女')}${g.league}</span>
            <span class="sg-match">${g.home} vs ${g.away}</span>
            <span class="sg-score">${sc}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  // === クラス別ビューを構築 ===
  function buildClassView(selectedTeam, filterSport){
    // 予選試合のhome/awayから実クラスを取得（トーナメントのダミー"梅T"などは除外）
    const allTeams = [...new Set(SCHEDULE.filter(g=>!g.bracket).flatMap(g=>[g.home, g.away]))].sort((a,b)=>{
      const [ay, ac] = a.split('-').map(Number);
      const [by, bc] = b.split('-').map(Number);
      if(ay !== by) return ay - by;
      return ac - bc;
    });
    if(!selectedTeam || !allTeams.includes(selectedTeam)) selectedTeam = allTeams[0];
    const team = selectedTeam;
    // フィルタ用：表示する競技配列
    const displaySports = filterSport ? [filterSport] : sports;
    
    // ヘルパー：リーグ順位（予選のみ）
    function getLeagueRanking(sport, league){
      const lg = SCHEDULE.filter(g=>g.sport===sport && g.league===league && !g.bracket);
      const teams = [...new Set(lg.flatMap(g=>[g.home, g.away]))];
      const stat = {};
      teams.forEach(t=>{ stat[t] = {team:t,pts:0,gf:0,ga:0}; });
      lg.forEach(g=>{
        const r = results[g.id];
        if(!r || r.status !== 'done' || r.homeScore == null) return;
        stat[g.home].gf += r.homeScore; stat[g.home].ga += r.awayScore;
        stat[g.away].gf += r.awayScore; stat[g.away].ga += r.homeScore;
        if(r.homeScore > r.awayScore){ stat[g.home].pts += 3; }
        else if(r.homeScore < r.awayScore){ stat[g.away].pts += 3; }
        else{ stat[g.home].pts += 1; stat[g.away].pts += 1; }
      });
      return Object.values(stat).sort((a,b)=>{
        if(b.pts !== a.pts) return b.pts - a.pts;
        const aDiff = a.gf - a.ga, bDiff = b.gf - b.ga;
        if(bDiff !== aDiff) return bDiff - aDiff;
        return b.gf - a.gf;
      });
    }
    function getSeeds(sport, grade){
      const idx = {'松':0, '竹':1, '梅':2}[grade];
      return ['A','B','C','D','E','F'].map(L=>{
        const sorted = getLeagueRanking(sport, L);
        return sorted[idx] ? sorted[idx].team : null;
      });
    }
    function getTMatch(sport, grade, matchKey){
      const g = SCHEDULE.find(g=>g.bracket && g.sport===sport && g.grade===grade && g.matchKey===matchKey);
      if(!g) return null;
      return { game: g, result: results[g.id] || null };
    }
    function tWinner(r, home, away){
      if(!r || r.status !== 'done' || r.homeScore == null) return null;
      if(r.winner === 'home') return home;
      if(r.winner === 'away') return away;
      if(r.homeScore === r.awayScore) return null;
      return r.homeScore > r.awayScore ? home : away;
    }
    function tLoser(r, home, away){
      if(!r || r.status !== 'done' || r.homeScore == null) return null;
      if(r.winner === 'home') return away;
      if(r.winner === 'away') return home;
      if(r.homeScore === r.awayScore) return null;
      return r.homeScore > r.awayScore ? away : home;
    }
    // 指定クラスが参加した全トーナメント試合を抽出
    // [{ sport, grade, matchKey, home, away, result, label, no }]
    function getClassTournamentMatches(team){
      const matches = [];
      const labelMap = {
        r1a: '1回戦', r1b: '1回戦', sf1: '準決勝', sf2: '準決勝',
        final: '決勝', third: '3位決定戦', fifth: '5位決定戦'
      };
      sports.forEach(sport=>{
        ['松','竹','梅'].forEach(grade=>{
          const seeds = getSeeds(sport, grade);
          const [tA, tB, tC, tD, tE, tF] = seeds;
          // 各試合の対戦カードを解決
          const r1a = getTMatch(sport, grade, 'r1a');
          const r1b = getTMatch(sport, grade, 'r1b');
          const sf1 = getTMatch(sport, grade, 'sf1');
          const sf2 = getTMatch(sport, grade, 'sf2');
          const fin = getTMatch(sport, grade, 'final');
          const th  = getTMatch(sport, grade, 'third');
          const fif = getTMatch(sport, grade, 'fifth');
          const r1aW = tWinner(r1a?.result, tA, tB);
          const r1aL = tLoser(r1a?.result, tA, tB);
          const r1bW = tWinner(r1b?.result, tE, tF);
          const r1bL = tLoser(r1b?.result, tE, tF);
          const sf1W = tWinner(sf1?.result, r1aW, tC);
          const sf1L = tLoser(sf1?.result, r1aW, tC);
          const sf2W = tWinner(sf2?.result, tD, r1bW);
          const sf2L = tLoser(sf2?.result, tD, r1bW);
          
          const cards = [
            { mk:'r1a', home: tA, away: tB, result: r1a?.result, no: r1a?.game?.no },
            { mk:'r1b', home: tE, away: tF, result: r1b?.result, no: r1b?.game?.no },
            { mk:'sf1', home: r1aW, away: tC, result: sf1?.result, no: sf1?.game?.no },
            { mk:'sf2', home: tD, away: r1bW, result: sf2?.result, no: sf2?.game?.no },
            { mk:'final', home: sf1W, away: sf2W, result: fin?.result, no: fin?.game?.no },
            { mk:'third', home: sf1L, away: sf2L, result: th?.result, no: th?.game?.no },
            { mk:'fifth', home: r1aL, away: r1bL, result: fif?.result, no: fif?.game?.no },
          ];
          cards.forEach(c=>{
            if(c.home === team || c.away === team){
              matches.push({
                sport, grade,
                matchKey: c.mk,
                label: `${grade}${labelMap[c.mk]}`,
                home: c.home, away: c.away,
                result: c.result,
                no: c.no,
              });
            }
          });
        });
      });
      return matches;
    }
    const allClassTMatches = getClassTournamentMatches(team);
    // 競技別にまとめる
    const tMatchesBySport = {};
    allClassTMatches.forEach(m=>{
      if(!tMatchesBySport[m.sport]) tMatchesBySport[m.sport] = [];
      tMatchesBySport[m.sport].push(m);
    });
    
    let totalW=0, totalL=0, totalD=0, totalGF=0, totalGA=0, totalGP=0;
    const sportBlocks = displaySports.map(sport=>{
      const sportGames = SCHEDULE.filter(g=>g.sport===sport && !g.bracket && (g.home===team || g.away===team));
      if(sportGames.length === 0){
        return `<div class="cv-sport-block">
          <div class="cv-sport-row">
            <div class="cv-sport-name">${sport}</div>
            <div class="cv-sport-stats"><span class="cv-rank no-data">未出場</span></div>
          </div>
        </div>`;
      }
      const league = sportGames[0].league;
      let w=0, l=0, d=0, gf=0, ga=0, done=0;
      sportGames.forEach(g=>{
        const r = results[g.id];
        if(!r || r.status !== 'done' || r.homeScore == null) return;
        done++;
        const isHome = g.home === team;
        const myScore = isHome ? r.homeScore : r.awayScore;
        const oppScore = isHome ? r.awayScore : r.homeScore;
        gf += myScore; ga += oppScore;
        if(myScore > oppScore) w++;
        else if(myScore < oppScore) l++;
        else d++;
      });
      totalW += w; totalL += l; totalD += d; totalGF += gf; totalGA += ga; totalGP += done;
      // リーグ内順位
      const sorted = getLeagueRanking(sport, league);
      const ranks = [];
      sorted.forEach((r, i)=>{
        if(i === 0) ranks.push(1);
        else{
          const prev = sorted[i-1];
          const isTied = (r.pts === prev.pts && (r.gf-r.ga) === (prev.gf-prev.ga) && r.gf === prev.gf);
          ranks.push(isTied ? ranks[i-1] : i+1);
        }
      });
      const myIdx = sorted.findIndex(s=>s.team===team);
      const myRank = myIdx >= 0 ? ranks[myIdx] : null;
      const diff = gf - ga;
      const diffStr = diff > 0 ? `+${diff}` : `${diff}`;
      const rankClass = myRank === 1 ? 'rank-1' : '';
      const rankText = (done === sportGames.length && myRank) ? `${myRank}位` : (done > 0 ? `暫定${myRank}位` : '未確定');
      // 予選試合行
      const matchRowsHtml = sportGames.map(g=>{
        const r = results[g.id];
        const isHome = g.home === team;
        const opponent = isHome ? g.away : g.home;
        if(!r || r.status !== 'done' || r.homeScore == null){
          return `<div class="cv-match-row pending">
            <span class="cv-match-no">試合${g.no}</span>
            <span class="cv-match-opp">vs ${opponent}</span>
            <span class="cv-match-score">未実施</span>
          </div>`;
        }
        const myScore = isHome ? r.homeScore : r.awayScore;
        const oppScore = isHome ? r.awayScore : r.homeScore;
        let resultLabel = '', resultClass = '';
        if(myScore > oppScore){ resultLabel = '勝'; resultClass = 'win'; }
        else if(myScore < oppScore){ resultLabel = '負'; resultClass = 'loss'; }
        else{ resultLabel = '分'; resultClass = 'draw'; }
        return `<div class="cv-match-row ${resultClass}">
          <span class="cv-match-no">試合${g.no}</span>
          <span class="cv-match-opp">vs ${opponent}</span>
          <span class="cv-match-score">${myScore} - ${oppScore}</span>
          <span class="cv-match-result ${resultClass}">${resultLabel}</span>
        </div>`;
      }).join('');
      // トーナメント試合行
      const tMatches = tMatchesBySport[sport] || [];
      let tournamentHtml = '';
      if(tMatches.length > 0){
        const tRows = tMatches.map(m=>{
          const isHome = m.home === team;
          const opponent = isHome ? m.away : m.home;
          const r = m.result;
          if(!r || r.status !== 'done' || r.homeScore == null){
            return `<div class="cv-match-row pending cv-t-row">
              <span class="cv-match-no">${m.label}</span>
              <span class="cv-match-opp">vs ${opponent||'未定'}</span>
              <span class="cv-match-score">未実施</span>
            </div>`;
          }
          // 勝者判定（winnerフィールド優先）
          let winSide = null;
          if(r.winner === 'home') winSide = 'home';
          else if(r.winner === 'away') winSide = 'away';
          else if(r.homeScore > r.awayScore) winSide = 'home';
          else if(r.awayScore > r.homeScore) winSide = 'away';
          const myWin = (isHome && winSide === 'home') || (!isHome && winSide === 'away');
          const isDraw = winSide === null;
          const myScore = isHome ? r.homeScore : r.awayScore;
          const oppScore = isHome ? r.awayScore : r.homeScore;
          let resultLabel, resultClass;
          if(isDraw){ resultLabel = '分'; resultClass = 'draw'; }
          else if(myWin){ resultLabel = '勝'; resultClass = 'win'; }
          else{ resultLabel = '負'; resultClass = 'loss'; }
          const noteHtml = r.note ? `<div class="cv-t-note">${r.note}</div>` : '';
          return `<div class="cv-match-row ${resultClass} cv-t-row">
            <span class="cv-match-no">${m.label}</span>
            <span class="cv-match-opp">vs ${opponent||'未定'}</span>
            <span class="cv-match-score">${myScore} - ${oppScore}</span>
            <span class="cv-match-result ${resultClass}">${resultLabel}</span>
            ${noteHtml}
          </div>`;
        }).join('');
        tournamentHtml = `<div class="cv-t-divider">トーナメント</div>${tRows}`;
      }
      return `<div class="cv-sport-block">
        <div class="cv-sport-row">
          <div class="cv-sport-name">${sport}<span class="cv-league-tag">${league}リーグ</span></div>
          <div class="cv-sport-stats">
            <span class="cv-wld"><span class="w">${w}</span>勝${d}分<span class="l">${l}</span>負</span>
            <span class="cv-gf">${gf}-${ga} (${diffStr})</span>
            <span class="cv-rank ${rankClass}">${rankText}</span>
          </div>
        </div>
        <div class="cv-match-list">${matchRowsHtml}${tournamentHtml}</div>
      </div>`;
    }).join('');
    const totalDiff = totalGF - totalGA;
    const totalDiffStr = totalDiff > 0 ? `+${totalDiff}` : `${totalDiff}`;
    const selectorHtml = `<div class="cv-selector">
      ${allTeams.map(t=>`<button class="cv-class-btn ${t===selectedTeam?'active':''}" data-team="${t}">${t}</button>`).join('')}
    </div>`;
    return `${selectorHtml}
      <div class="cv-summary-card">
        <div class="cv-summary-head">
          <span>${team}</span>
          <span class="cv-total-badge">${totalGP}試合完了</span>
        </div>
        ${sportBlocks}
        <div class="cv-total-row">
          <div class="cv-total-label">総合戦績</div>
          <div class="cv-total-stats">
            <span><span class="w">${totalW}</span>勝 ${totalD}分 <span class="l">${totalL}</span>負</span>
            <span>得${totalGF} 失${totalGA} (${totalDiffStr})</span>
          </div>
        </div>
      </div>`;
  }
  // 現在選択中のクラス（クロージャ変数）
  if(!window._viewerSelectedClass){
    const firstTeam = [...new Set(SCHEDULE.flatMap(g=>[g.home, g.away]).filter(t=>t && t!=='' && !t.endsWith('T')))].sort()[0];
    window._viewerSelectedClass = firstTeam;
  }

  // ==== 最終結果ビュー（総合順位） ====
  function buildFinalResultView(){
    const sportsList = ['男子バスケ','女子バスケ','男子サッカー','女子サッカー','男子バレー','女子バレー'];
    
    // ヘルパー（buildTournamentView と同じロジック）
    function getLeagueRanking(sport, league){
      const lg = SCHEDULE.filter(g=>g.sport===sport && g.league===league && !g.bracket);
      const teams = [...new Set(lg.flatMap(g=>[g.home, g.away]))];
      const stat = {};
      teams.forEach(t=>{ stat[t] = {team:t,pts:0,gf:0,ga:0}; });
      lg.forEach(g=>{
        const r = results[g.id];
        if(!r || r.status !== 'done' || r.homeScore == null) return;
        stat[g.home].gf += r.homeScore; stat[g.home].ga += r.awayScore;
        stat[g.away].gf += r.awayScore; stat[g.away].ga += r.homeScore;
        if(r.homeScore > r.awayScore){ stat[g.home].pts += 3; }
        else if(r.homeScore < r.awayScore){ stat[g.away].pts += 3; }
        else{ stat[g.home].pts += 1; stat[g.away].pts += 1; }
      });
      return Object.values(stat).sort((a,b)=>{
        if(b.pts !== a.pts) return b.pts - a.pts;
        const aDiff = a.gf - a.ga, bDiff = b.gf - b.ga;
        if(bDiff !== aDiff) return bDiff - aDiff;
        return b.gf - a.gf;
      });
    }
    function getSeeds(sport, grade){
      const idx = {'松':0, '竹':1, '梅':2}[grade];
      return ['A','B','C','D','E','F'].map(L=>{
        const sorted = getLeagueRanking(sport, L);
        return sorted[idx] ? sorted[idx].team : null;
      });
    }
    function getMatch(sport, grade, mk){
      const g = SCHEDULE.find(g=>g.bracket && g.sport===sport && g.grade===grade && g.matchKey===mk);
      if(!g) return null;
      const r = results[g.id];
      if(!r || r.status !== 'done' || r.homeScore == null) return null;
      return r;
    }
    function getWin(r, h, a){
      if(!r) return null;
      if(r.winner === 'home') return h;
      if(r.winner === 'away') return a;
      if(r.homeScore === r.awayScore) return null;
      return r.homeScore > r.awayScore ? h : a;
    }
    function getLose(r, h, a){
      if(!r) return null;
      if(r.winner === 'home') return a;
      if(r.winner === 'away') return h;
      if(r.homeScore === r.awayScore) return null;
      return r.homeScore > r.awayScore ? a : h;
    }
    
    // 1競技の1グレード（松/竹/梅）から1〜6位を抽出
    // 戻り値: [1位, 2位, 3位, 4位, 5位, 6位] のクラス名配列（未確定はnull）
    function getRankingForGrade(sport, grade){
      const seeds = getSeeds(sport, grade);
      const [tA, tB, tC, tD, tE, tF] = seeds;
      const r1a = getMatch(sport, grade, 'r1a');
      const r1b = getMatch(sport, grade, 'r1b');
      const r1aW = getWin(r1a, tA, tB);
      const r1aL = getLose(r1a, tA, tB);
      const r1bW = getWin(r1b, tE, tF);
      const r1bL = getLose(r1b, tE, tF);
      const sf1 = getMatch(sport, grade, 'sf1');
      const sf2 = getMatch(sport, grade, 'sf2');
      const sf1W = getWin(sf1, r1aW, tC);
      const sf1L = getLose(sf1, r1aW, tC);
      const sf2W = getWin(sf2, tD, r1bW);
      const sf2L = getLose(sf2, tD, r1bW);
      const fin = getMatch(sport, grade, 'final');
      const th = getMatch(sport, grade, 'third');
      const fif = getMatch(sport, grade, 'fifth');
      const finW = getWin(fin, sf1W, sf2W);
      const finL = getLose(fin, sf1W, sf2W);
      const thW = getWin(th, sf1L, sf2L);
      const thL = getLose(th, sf1L, sf2L);
      const fifW = getWin(fif, r1aL, r1bL);
      const fifL = getLose(fif, r1aL, r1bL);
      return [finW, finL, thW, thL, fifW, fifL];
    }
    
    // 全競技×全グレードで集計：クラスごとの合計点を計算
    // 順位ポイント：1位=18, 2位=17, ..., 18位=1
    const classPoints = {};
    const classRanksBySport = {}; // {team: {sport: rank}}
    
    sportsList.forEach(sport=>{
      ['松','竹','梅'].forEach(grade=>{
        const ranks = getRankingForGrade(sport, grade);
        const baseRank = grade === '松' ? 0 : grade === '竹' ? 6 : 12;
        ranks.forEach((team, idx)=>{
          if(!team) return;
          const overallRank = baseRank + idx + 1; // 1〜18
          const points = 19 - overallRank; // 1位=18, 18位=1
          if(!classPoints[team]) classPoints[team] = 0;
          classPoints[team] += points;
          if(!classRanksBySport[team]) classRanksBySport[team] = {};
          classRanksBySport[team][sport] = overallRank;
        });
      });
    });
    
    // 全クラス一覧（予選試合から抽出）
    const allClasses = [...new Set(SCHEDULE.filter(g=>!g.bracket).flatMap(g=>[g.home, g.away]))];
    // 未集計のクラスは0点で初期化
    allClasses.forEach(c=>{ if(classPoints[c] === undefined) classPoints[c] = 0; });
    
    // 順位を集計
    const ranking = allClasses.map(c=>({ team: c, points: classPoints[c] }))
      .sort((a,b)=>b.points - a.points);
    
    // 順位を確定（同点処理：同点は同順位）
    const ranks = [];
    ranking.forEach((r, i)=>{
      if(i === 0) ranks.push(1);
      else{
        const prev = ranking[i-1];
        ranks.push(r.points === prev.points ? ranks[i-1] : i+1);
      }
    });
    
    const totalDone = SCHEDULE.filter(g=>{
      const r = results[g.id];
      return r && r.status === 'done' && r.homeScore != null;
    }).length;
    const totalGames = SCHEDULE.length;
    const isComplete = totalDone === totalGames;
    
    // 1〜18位を一括で並べる
    const rowsHtml = ranking.map((item, i)=>{
      const rank = ranks[i];
      let rankClass = 'fr-rank-default';
      if(rank === 1) rankClass = 'fr-rank-gold';
      else if(rank === 2) rankClass = 'fr-rank-silver';
      else if(rank === 3) rankClass = 'fr-rank-bronze';
      return `<button class="fr-row" data-team="${item.team}" data-points="${item.points}">
        <span class="fr-rank ${rankClass}">${rank}位</span>
        <span class="fr-team">${item.team}</span>
        <span class="fr-points">${item.points}<span class="fr-pts-unit">pt</span></span>
      </button>`;
    }).join('');

    // 競技別 1〜18位
    function buildSportSection(sport){
      const sportAllClasses = [...new Set(SCHEDULE.filter(g=>!g.bracket && g.sport===sport).flatMap(g=>[g.home, g.away]))];
      const sportRanks = {};
      ['松','竹','梅'].forEach(grade=>{
        const ranks2 = getRankingForGrade(sport, grade);
        const baseRank = grade === '松' ? 0 : grade === '竹' ? 6 : 12;
        ranks2.forEach((team, idx)=>{
          if(team) sportRanks[team] = baseRank + idx + 1;
        });
      });
      const ranked = sportAllClasses.filter(c=>sportRanks[c]).sort((a,b)=>sportRanks[a]-sportRanks[b]);
      const unranked = sportAllClasses.filter(c=>!sportRanks[c]).sort();
      const rankedHtml = ranked.map(team=>{
        const rank = sportRanks[team];
        let rc = 'fr-rank-default';
        if(rank === 1) rc = 'fr-rank-gold';
        else if(rank === 2) rc = 'fr-rank-silver';
        else if(rank === 3) rc = 'fr-rank-bronze';
        return `<button class="fr-row" data-team="${team}" data-sport="${sport}">
          <span class="fr-rank ${rc}">${rank}位</span>
          <span class="fr-team">${team}</span>
        </button>`;
      }).join('');
      const unrankedHtml = unranked.map(team=>{
        return `<button class="fr-row" data-team="${team}" data-sport="${sport}">
          <span class="fr-rank fr-rank-default">未確定</span>
          <span class="fr-team">${team}</span>
        </button>`;
      }).join('');
      return `<div class="fr-group">
        <h3 class="fr-group-title">${sport} 順位</h3>
        <div class="fr-rows">${rankedHtml}${unrankedHtml}</div>
      </div>`;
    }

    if(!window._viewerFinalTab) window._viewerFinalTab = 'overall';
    const currentTab = window._viewerFinalTab;
    const overallTab = `<button class="fr-tab ${currentTab==='overall'?'active':''}" data-tab="overall">競技総合</button>`;
    const sportTabs = sportsList.map(s=>
      `<button class="fr-tab ${s===currentTab?'active':''}" data-tab="${s}">${s}</button>`
    ).join('');
    const tabsHtml = `
      <div class="fr-tabs-overall">${overallTab}</div>
      <div class="fr-tabs-sports">${sportTabs}</div>
    `;

    let mainContent;
    if(currentTab === 'overall'){
      mainContent = `
        <div class="fr-info">
          <strong>点数体系：</strong>各競技で1位=18点、2位=17点、3位=16点、…、18位=1点。<br>
          全6競技の合計点で競技総合順位を算出します。
        </div>
        <div class="fr-group">
          <h3 class="fr-group-title">競技総合 順位</h3>
          <div class="fr-rows">${rowsHtml}</div>
        </div>`;
    } else {
      mainContent = buildSportSection(currentTab);
    }

    return `<div class="fr-container">
      ${!isComplete ? `<div class="fr-warn">⚠ まだ全試合が終了していません（${totalDone}/${totalGames}完了）。表示は途中経過です。</div>` : ''}
      <div class="fr-tabs">${tabsHtml}</div>
      ${mainContent}
    </div>`;
  }
  
  // クラス詳細モーダル
  window._openClassDetailModal = function(team, filterSport){
    const overlay = document.createElement('div');
    overlay.className = 'fr-modal-overlay';
    const titleSuffix = filterSport ? ` の${filterSport}戦績` : ' の戦績';
    overlay.innerHTML = `
      <div class="fr-modal">
        <div class="fr-modal-head">
          <span class="fr-modal-title">${team}${titleSuffix}</span>
          <button class="fr-modal-close" aria-label="閉じる">×</button>
        </div>
        <div class="fr-modal-body">${buildClassView(team, filterSport)}</div>
      </div>
    `;

    overlay.querySelector('.fr-modal-close').onclick = ()=>overlay.remove();
    overlay.onclick = (e)=>{ if(e.target === overlay) overlay.remove(); };
  };

  // ==== トーナメント表ビュー（3サブタブ） ====
  function buildTournamentView(selSport, selGrade, subTab){
    const sports = ['男子バスケ','女子バスケ','男子サッカー','女子サッカー','男子バレー','女子バレー'];
    const grades = ['松','竹','梅'];
    if(!selSport || !sports.includes(selSport)) selSport = sports[0];
    if(!selGrade) selGrade = '松';
    if(!subTab) subTab = 'detail';

    // リーグ順位計算（予選試合のみ）
    function getLeagueRanking(sport, league){
      const lg = SCHEDULE.filter(g=>g.sport===sport && g.league===league && !g.bracket);
      const teams = [...new Set(lg.flatMap(g=>[g.home, g.away]))];
      const stat = {};
      teams.forEach(t=>{ stat[t] = {team:t,pts:0,gf:0,ga:0}; });
      lg.forEach(g=>{
        const r = results[g.id];
        if(!r || r.status !== 'done' || r.homeScore == null) return;
        stat[g.home].gf += r.homeScore; stat[g.home].ga += r.awayScore;
        stat[g.away].gf += r.awayScore; stat[g.away].ga += r.homeScore;
        if(r.homeScore > r.awayScore){ stat[g.home].pts += 3; }
        else if(r.homeScore < r.awayScore){ stat[g.away].pts += 3; }
        else{ stat[g.home].pts += 1; stat[g.away].pts += 1; }
      });
      return Object.values(stat).sort((a,b)=>{
        if(b.pts !== a.pts) return b.pts - a.pts;
        const aDiff = a.gf - a.ga, bDiff = b.gf - b.ga;
        if(bDiff !== aDiff) return bDiff - aDiff;
        return b.gf - a.gf;
      });
    }
    function getSeeds(sport, grade){
      const idx = {'松':0, '竹':1, '梅':2}[grade];
      return ['A','B','C','D','E','F'].map(L=>{
        const sorted = getLeagueRanking(sport, L);
        return sorted[idx] ? sorted[idx].team : null;
      });
    }
    function getMatch(sport, grade, matchKey){
      const g = SCHEDULE.find(g=>g.bracket && g.sport===sport && g.grade===grade && g.matchKey===matchKey);
      if(!g) return null;
      const r = results[g.id];
      if(!r || r.status !== 'done' || r.homeScore == null) return null;
      return r;
    }
    function getWinner(sport, grade, matchKey, homeT, awayT){
      const r = getMatch(sport, grade, matchKey);
      if(!r) return null;
      if(r.winner === 'home') return homeT;
      if(r.winner === 'away') return awayT;
      if(r.homeScore === r.awayScore) return null;
      return r.homeScore > r.awayScore ? homeT : awayT;
    }
    function getLoser(sport, grade, matchKey, homeT, awayT){
      const r = getMatch(sport, grade, matchKey);
      if(!r) return null;
      if(r.winner === 'home') return awayT;
      if(r.winner === 'away') return homeT;
      if(r.homeScore === r.awayScore) return null;
      return r.homeScore > r.awayScore ? awayT : homeT;
    }
    // トーナメント全体の進行状況サマリ
    function getTournamentSummary(sport, grade){
      const seeds = getSeeds(sport, grade);
      const [tA, tB, tC, tD, tE, tF] = seeds;
      const r1a = getMatch(sport, grade, 'r1a');
      const r1b = getMatch(sport, grade, 'r1b');
      const sf1 = getMatch(sport, grade, 'sf1');
      const sf2 = getMatch(sport, grade, 'sf2');
      const fin = getMatch(sport, grade, 'final');
      const r1aW = getWinner(sport, grade, 'r1a', tA, tB);
      const r1bW = getWinner(sport, grade, 'r1b', tE, tF);
      const sf1W = getWinner(sport, grade, 'sf1', r1aW, tC);
      const sf2W = getWinner(sport, grade, 'sf2', tD, r1bW);
      const finW = getWinner(sport, grade, 'final', sf1W, sf2W);
      let phase = '未開始';
      let phaseClass = 'pending';
      if(finW){ phase = `優勝: ${finW}`; phaseClass = 'champion'; }
      else if(fin){ phase = '決勝終了'; phaseClass = 'live'; }
      else if(sf1 && sf2){ phase = '決勝待ち'; phaseClass = 'live'; }
      else if(sf1 || sf2){ phase = '準決勝中'; phaseClass = 'live'; }
      else if(r1a && r1b){ phase = '準決勝待ち'; phaseClass = 'live'; }
      else if(r1a || r1b){ phase = '1回戦中'; phaseClass = 'live'; }
      else{
        // シードがセットされているか
        if(seeds.every(s=>s)) { phase = '開始待ち'; phaseClass = 'ready'; }
      }
      return { phase, phaseClass, champion: finW };
    }

    // === サブビュー1: 一覧 ===
    function buildOverview(){
      const cards = sports.flatMap(sport=>{
        return grades.map(grade=>{
          const summary = getTournamentSummary(sport, grade);
          return `<button class="tour-card-btn" data-sport="${sport}" data-grade="${grade}">
            <div class="tc-sport">${sport}</div>
            <div class="tc-grade tc-grade-${grade}">${grade}</div>
            <div class="tc-phase tc-${summary.phaseClass}">${summary.phase}</div>
          </button>`;
        });
      }).join('');
      return `<div class="tour-overview-grid">${cards}</div>`;
    }

    // === サブビュー2: タイムライン ===
    function buildTimeline(){
      // 3日目・4日目のトーナメント試合を試合枠ごとにまとめる
      const tGames = SCHEDULE.filter(g=>g.bracket).sort((a,b)=>{
        if(a.no !== b.no) return a.no - b.no;
        return 0;
      });
      // 試合枠ごとにグルーピング
      const groups = {};
      tGames.forEach(g=>{
        const key = `${g.no}`;
        if(!groups[key]) groups[key] = { no: g.no, time: g.time, end: g.end, day: gameDay(g), games: [] };
        groups[key].games.push(g);
      });
      const groupList = Object.values(groups).sort((a,b)=>a.no - b.no);

      // 各試合の対戦カード解決
      function resolveCard(g){
        const sport = g.sport, grade = g.grade, mkey = g.matchKey;
        const seeds = getSeeds(sport, grade);
        const [tA, tB, tC, tD, tE, tF] = seeds;
        let home, away;
        switch(mkey){
          case 'r1a': home = tA; away = tB; break;
          case 'r1b': home = tE; away = tF; break;
          case 'sf1': home = getWinner(sport, grade, 'r1a', tA, tB); away = tC; break;
          case 'sf2': home = tD; away = getWinner(sport, grade, 'r1b', tE, tF); break;
          case 'final': 
            home = getWinner(sport, grade, 'sf1', getWinner(sport, grade, 'r1a', tA, tB), tC);
            away = getWinner(sport, grade, 'sf2', tD, getWinner(sport, grade, 'r1b', tE, tF));
            break;
          case 'third':
            home = getLoser(sport, grade, 'sf1', getWinner(sport, grade, 'r1a', tA, tB), tC);
            away = getLoser(sport, grade, 'sf2', tD, getWinner(sport, grade, 'r1b', tE, tF));
            break;
          case 'fifth':
            home = getLoser(sport, grade, 'r1a', tA, tB);
            away = getLoser(sport, grade, 'r1b', tE, tF);
            break;
        }
        return { home, away };
      }
      const matchNameMap = {r1a:'1回戦', r1b:'1回戦', sf1:'準決勝', sf2:'準決勝', final:'決勝', third:'3位決定戦', fifth:'5位決定戦'};

      const blocks = groupList.map(grp=>{
        const dayLabel = `${grp.day}日目`;
        let displayNo = grp.no;
        if(grp.no >= 101 && grp.no <= 199) displayNo = grp.no - 100;
        else if(grp.no >= 201 && grp.no <= 299) displayNo = grp.no - 200;
        const rows = grp.games.map(g=>{
          const card = resolveCard(g);
          const r = results[g.id];
          const has = r && r.status === 'done' && r.homeScore != null;
          const winnerSide = has ? (r.homeScore > r.awayScore ? 'home' : r.awayScore > r.homeScore ? 'away' : 'draw') : '';
          const homeLabel = card.home || `${g.grade}T`;
          const awayLabel = card.away || `${g.grade}T`;
          return `<div class="tl-row ${has?'done':''}">
            <span class="tl-sport">${g.sport}</span>
            <span class="tl-round ${g.grade}">${g.grade} ${matchNameMap[g.matchKey]||''}</span>
            <span class="tl-card">
              <span class="tl-home ${winnerSide==='home'?'win':''}">${homeLabel}</span>
              <span class="tl-vs">vs</span>
              <span class="tl-away ${winnerSide==='away'?'win':''}">${awayLabel}</span>
            </span>
            <span class="tl-score">${has?`${r.homeScore}-${r.awayScore}`:'-'}</span>
          </div>`;
        }).join('');
        return `<div class="tl-block">
          <div class="tl-head">
            <span class="tl-day">${dayLabel}</span>
            <span class="tl-no">試合${displayNo}</span>
            <span class="tl-time">${grp.time}〜${grp.end}</span>
          </div>
          <div class="tl-body">${rows}</div>
        </div>`;
      }).join('');
      return `<div class="tl-container">${blocks}</div>`;
    }

    // === サブビュー3: 詳細（既存トーナメント図） ===
    function buildDetail(){
      const seeds = getSeeds(selSport, selGrade);
      const [tA, tB, tC, tD, tE, tF] = seeds;
      const r1aWin = getWinner(selSport, selGrade, 'r1a', tA, tB);
      const r1aLose = getLoser(selSport, selGrade, 'r1a', tA, tB);
      const r1bWin = getWinner(selSport, selGrade, 'r1b', tE, tF);
      const r1bLose = getLoser(selSport, selGrade, 'r1b', tE, tF);
      const sf1Win = getWinner(selSport, selGrade, 'sf1', r1aWin, tC);
      const sf1Lose = getLoser(selSport, selGrade, 'sf1', r1aWin, tC);
      const sf2Win = getWinner(selSport, selGrade, 'sf2', tD, r1bWin);
      const sf2Lose = getLoser(selSport, selGrade, 'sf2', tD, r1bWin);
      const finalWin = getWinner(selSport, selGrade, 'final', sf1Win, sf2Win);
      const thirdWin = getWinner(selSport, selGrade, 'third', sf1Lose, sf2Lose);
      const fifthWin = getWinner(selSport, selGrade, 'fifth', r1aLose, r1bLose);

      function matchBox(matchKey, homeT, awayT){
        const r = getMatch(selSport, selGrade, matchKey);
        const has = !!r;
        let hH = false, hA = false;
        if(has){
          if(r.winner === 'home') hH = true;
          else if(r.winner === 'away') hA = true;
          else if(r.homeScore > r.awayScore) hH = true;
          else if(r.awayScore > r.homeScore) hA = true;
        }
        const hLabel = homeT || '未定';
        const aLabel = awayT || '未定';
        const hCls = (!homeT?'tbd':'') + (hH?' winner':'');
        const aCls = (!awayT?'tbd':'') + (hA?' winner':'');
        const noteHtml = (has && r.note) ? `<div class="vt-note">${r.note}</div>` : '';
        return `<div class="vt-mbox ${has?'done':''}">
          <div class="vt-team ${hCls}"><span>${hLabel}</span><span class="vt-score">${has?r.homeScore:''}</span></div>
          <div class="vt-div"></div>
          <div class="vt-team ${aCls}"><span>${aLabel}</span><span class="vt-score">${has?r.awayScore:''}</span></div>
          ${noteHtml}
        </div>`;
      }

      const sportBtns = sports.map(s=>`<button class="vt-sport-btn ${s===selSport?'active':''}" data-sport="${s}">${s}</button>`).join('');
      const gradeBtns = [
        {key:'松', label:'松（1位）'}, {key:'竹', label:'竹（2位）'}, {key:'梅', label:'梅（3位）'},
      ].map(g=>`<button class="vt-grade-btn ${g.key===selGrade?'active':''}" data-grade="${g.key}">${g.label}</button>`).join('');

      return `<div class="vt-selectors">
        <div class="vt-sport-row">${sportBtns}</div>
        <div class="vt-grade-row">${gradeBtns}</div>
      </div>
      <div class="vt-bracket">
        <div class="vt-title">${selSport} ${selGrade}トーナメント</div>
        <div class="vt-svg-wrap">
          <svg viewBox="0 0 420 360" class="vt-svg" xmlns="http://www.w3.org/2000/svg">
            <g stroke="#0a0a0a" stroke-width="1.5" fill="none">
              <line x1="70" y1="20" x2="160" y2="20"/>
              <line x1="70" y1="60" x2="160" y2="60"/>
              <line x1="160" y1="20" x2="160" y2="60"/>
              <line x1="220" y1="40" x2="245" y2="40"/>
              <line x1="70" y1="100" x2="245" y2="100"/>
              <line x1="245" y1="40" x2="245" y2="100"/>
              <line x1="245" y1="70" x2="260" y2="70"/>
              <line x1="320" y1="70" x2="345" y2="70"/>
              <line x1="70" y1="260" x2="245" y2="260"/>
              <line x1="70" y1="300" x2="160" y2="300"/>
              <line x1="70" y1="340" x2="160" y2="340"/>
              <line x1="160" y1="300" x2="160" y2="340"/>
              <line x1="220" y1="320" x2="245" y2="320"/>
              <line x1="245" y1="260" x2="245" y2="320"/>
              <line x1="245" y1="290" x2="260" y2="290"/>
              <line x1="320" y1="290" x2="345" y2="290"/>
              <line x1="345" y1="70" x2="345" y2="290"/>
              <line x1="345" y1="180" x2="360" y2="180"/>
            </g>
            <g>
              <rect x="10" y="8" width="60" height="24" rx="3" fill="#fafaf7" stroke="#0a0a0a" stroke-width="1.5"/>
              <text x="40" y="24" text-anchor="middle" class="vt-seed ${!tA?'tbd':''}">${tA||'未定'}</text>
              <rect x="10" y="48" width="60" height="24" rx="3" fill="#fafaf7" stroke="#0a0a0a" stroke-width="1.5"/>
              <text x="40" y="64" text-anchor="middle" class="vt-seed ${!tB?'tbd':''}">${tB||'未定'}</text>
              <rect x="10" y="88" width="60" height="24" rx="3" fill="#fafaf7" stroke="#0a0a0a" stroke-width="1.5"/>
              <text x="40" y="104" text-anchor="middle" class="vt-seed ${!tC?'tbd':''}">${tC||'未定'}</text>
              <rect x="10" y="248" width="60" height="24" rx="3" fill="#fafaf7" stroke="#0a0a0a" stroke-width="1.5"/>
              <text x="40" y="264" text-anchor="middle" class="vt-seed ${!tD?'tbd':''}">${tD||'未定'}</text>
              <rect x="10" y="288" width="60" height="24" rx="3" fill="#fafaf7" stroke="#0a0a0a" stroke-width="1.5"/>
              <text x="40" y="304" text-anchor="middle" class="vt-seed ${!tE?'tbd':''}">${tE||'未定'}</text>
              <rect x="10" y="328" width="60" height="24" rx="3" fill="#fafaf7" stroke="#0a0a0a" stroke-width="1.5"/>
              <text x="40" y="344" text-anchor="middle" class="vt-seed ${!tF?'tbd':''}">${tF||'未定'}</text>
            </g>
            <g>
              <text x="5" y="24" class="vt-seed-label">A</text>
              <text x="5" y="64" class="vt-seed-label">B</text>
              <text x="5" y="104" class="vt-seed-label">C</text>
              <text x="5" y="264" class="vt-seed-label">D</text>
              <text x="5" y="304" class="vt-seed-label">E</text>
              <text x="5" y="344" class="vt-seed-label">F</text>
            </g>
            <foreignObject x="160" y="10" width="60" height="64">${matchBox('r1a', tA, tB)}</foreignObject>
            <foreignObject x="160" y="290" width="60" height="64">${matchBox('r1b', tE, tF)}</foreignObject>
            <foreignObject x="260" y="40" width="60" height="64">${matchBox('sf1', r1aWin, tC)}</foreignObject>
            <foreignObject x="260" y="260" width="60" height="64">${matchBox('sf2', tD, r1bWin)}</foreignObject>
            <foreignObject x="360" y="150" width="60" height="64">${matchBox('final', sf1Win, sf2Win)}</foreignObject>
          </svg>
        </div>
        ${finalWin ? `<div class="vt-champion">${selGrade}優勝 ${finalWin}</div>` : ''}
      </div>
      <div class="vt-extras">
        <div class="vt-extra-card">
          <h4>3位決定戦</h4>
          ${matchBox('third', sf1Lose, sf2Lose)}
          ${thirdWin ? `<div class="vt-rank-result third">${selGrade}T 3位: ${thirdWin}</div>` : ''}
        </div>
        <div class="vt-extra-card">
          <h4>5位決定戦</h4>
          ${matchBox('fifth', r1aLose, r1bLose)}
          ${fifthWin ? `<div class="vt-rank-result fifth">${selGrade}T 5位: ${fifthWin}</div>` : ''}
        </div>
      </div>`;
    }

    // === サブタブ切替 ===
    const subTabs = [
      { key: 'overview', label: '🗺 一覧' },
      { key: 'timeline', label: '📅 タイムライン' },
      { key: 'detail', label: '🏆 詳細' },
    ];
    const subTabBtns = subTabs.map(t=>`<button class="vt-subtab-btn ${t.key===subTab?'active':''}" data-subtab="${t.key}">${t.label}</button>`).join('');
    let content = '';
    if(subTab === 'overview') content = buildOverview();
    else if(subTab === 'timeline') content = buildTimeline();
    else content = buildDetail();
    return `<div class="vt-subtabs">${subTabBtns}</div><div class="vt-subtab-content">${content}</div>`;
  }

  if(!window._viewerSelectedSport){
    window._viewerSelectedSport = '男子バスケ';
    window._viewerSelectedGrade = '松';
  }
  if(!window._viewerTournamentSubtab){
    window._viewerTournamentSubtab = 'overview';
  }

  document.getElementById('container').innerHTML = `
    <div class="report-header" id="sec-top">
      <h1>🏃 体育祭 速報</h1>
      <div class="ts">スナップショット時刻：${dateStr}</div>
      <div class="progress">${done} / ${total} 試合完了</div>
    </div>
    <div class="viewer-note"><strong>📋 この資料について：</strong>本部システムから書き出した速報のスナップショットです。最新の状況を見るには、本部から新しい速報URLを受け取ってください。</div>
    ${delayHtml}
    <div id="sec-live">
      ${liveGames.length>0 ? `<section class="live-block"><h2>● 進行中 ${liveGames.length}試合</h2><div class="g-grid">${liveGames.map(gameCell).join('')}</div></section>` : ''}
      ${nextGames.length>0 ? `<section class="next-block"><h2>次の試合 ${nextGames.length}件</h2><div class="g-grid">${nextGames.map(gameCell).join('')}</div></section>` : ''}
      ${liveGames.length===0 && nextGames.length===0 ? `<section class="next-block"><h2>進行中・次の試合</h2><div class="empty" style="padding:1rem;text-align:center;color:#999">該当する試合がありません</div></section>` : ''}
    </div>
    <section id="sec-standings"><h2>順位表</h2>${standingsHtml}</section>
    <section id="sec-class"><h2>クラス別戦績</h2><div id="class-view-container">${buildClassView(window._viewerSelectedClass)}</div></section>
    <section id="sec-tournament"><h2>決勝トーナメント</h2><div id="tournament-view-container">${buildTournamentView(window._viewerSelectedSport, window._viewerSelectedGrade, window._viewerTournamentSubtab)}</div></section>
    <section id="sec-final"><h2>🏆 最終結果（競技総合順位）</h2><div id="final-view-container">${buildFinalResultView()}</div></section>
    <section id="sec-schedule"><h2>試合スケジュール</h2>${scheduleHtml}</section>
    <div class="footer">スナップショット：${dateStr} / 体育祭速報ビューア</div>
    <div style="height:80px"></div>

    <nav class="bottom-tabs">
      <button class="bt-btn" data-target="sec-top"><span class="bt-ico">🏠</span><span>トップ</span></button>
      <button class="bt-btn" data-target="sec-live"><span class="bt-ico">📺</span><span>LIVE</span></button>
      <button class="bt-btn" data-target="sec-standings"><span class="bt-ico">🏆</span><span>順位</span></button>
      <button class="bt-btn" data-target="sec-class"><span class="bt-ico">👥</span><span>クラス</span></button>
      <button class="bt-btn" data-target="sec-tournament"><span class="bt-ico">🥇</span><span>決勝T</span></button>
      <button class="bt-btn" data-target="sec-final"><span class="bt-ico">🎖</span><span>最終</span></button>
      <button class="bt-btn" data-target="sec-schedule"><span class="bt-ico">📋</span><span>日程</span></button>
    </nav>
  `;
  // タブクリックでスクロールジャンプ
  document.querySelectorAll('.bt-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const target = document.getElementById(b.dataset.target);
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'start'});
      }
    });
  });
  // クラス選択ボタン
  function attachClassBtnEvents(){
    document.querySelectorAll('.cv-class-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        window._viewerSelectedClass = b.dataset.team;
        document.getElementById('class-view-container').innerHTML = buildClassView(window._viewerSelectedClass);
        attachClassBtnEvents();
      });
    });
  }
  attachClassBtnEvents();
  // トーナメント選択ボタン
  function attachTournamentBtnEvents(){
    function refresh(){
      document.getElementById('tournament-view-container').innerHTML = buildTournamentView(window._viewerSelectedSport, window._viewerSelectedGrade, window._viewerTournamentSubtab);
      attachTournamentBtnEvents();
    }
    document.querySelectorAll('.vt-subtab-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        window._viewerTournamentSubtab = b.dataset.subtab;
        refresh();
      });
    });
    document.querySelectorAll('.vt-sport-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        window._viewerSelectedSport = b.dataset.sport;
        refresh();
      });
    });
    document.querySelectorAll('.vt-grade-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        window._viewerSelectedGrade = b.dataset.grade;
        refresh();
      });
    });
    // 一覧カードをタップ→詳細にジャンプ
    document.querySelectorAll('.tour-card-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        window._viewerSelectedSport = b.dataset.sport;
        window._viewerSelectedGrade = b.dataset.grade;
        window._viewerTournamentSubtab = 'detail';
        refresh();
      });
    });
  }
  attachTournamentBtnEvents();
  
  // 最終結果のクラスタップ→モーダル表示、タブ切り替え
  function attachFinalBtnEvents(){
    document.querySelectorAll('.fr-row').forEach(b=>{
      b.addEventListener('click', ()=>{
        const team = b.dataset.team;
        const sport = b.dataset.sport;
        if(team) window._openClassDetailModal(team, sport);
      });
    });
    document.querySelectorAll('.fr-tab').forEach(b=>{
      b.addEventListener('click', ()=>{
        const tab = b.dataset.tab;
        if(!tab) return;
        window._viewerFinalTab = tab;
        // 最終結果セクションだけを再描画
        const finalSection = document.querySelector('#sec-final');
        if(finalSection){
          const containerId = 'final-view-container';
          let container = document.getElementById(containerId);
          if(!container){
            // 初回作成時は<section>にidを付ける構造でない場合があるので親に書き換え
            container = finalSection.querySelector('.fr-container').parentElement;
          }
          if(container){
            container.innerHTML = buildFinalResultView();
            attachFinalBtnEvents();
          }
        }
      });
    });
  }
  attachFinalBtnEvents();
}

// 初期化
window.addEventListener('load', ()=>{
  const snapshot = decodeHashData();
  render(snapshot);
});
window.addEventListener('hashchange', ()=>{
  const snapshot = decodeHashData();
  render(snapshot);
});
</script>
</body>
</html>
